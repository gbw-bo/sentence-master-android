<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>句式大师 · 每日一句式</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="android.css" />
</head>
<body>
  <!-- 顶部应用栏（手机端显示；平板横屏时隐藏，由下方 #chrome 品牌栏代替） -->
  <header id="appbar">
    <span class="logo">句</span>
    <span class="title">句式大师</span>
  </header>

  <div id="chrome">
    <div class="brand"><span class="dot"></span>句式大师 <span style="font-weight:400;opacity:.8;font-size:12px;">SentenceMaster 1.4.4</span></div>
    <div class="win-btns">
      <button id="btnMin" title="最小化">—</button>
      <button id="btnClose" title="关闭">✕</button>
    </div>
  </div>

  <div id="app">
    <aside id="sidebar">
      <div class="nav-item active" data-page="learn"><span class="ic">📘</span>今日学习 <span class="badge" id="navLearnBadge">0</span></div>
      <div class="nav-item" data-page="review"><span class="ic">🔁</span>智能复习 <span class="badge muted" id="navReviewBadge">0</span></div>
      <div class="nav-item" data-page="library"><span class="ic">📚</span>句式库</div>
      <div class="nav-item" data-page="template"><span class="ic">✍️</span>作文模板</div>
      <div class="nav-item" data-page="me"><span class="ic">👤</span>我的</div>
      <div class="side-foot">
        <div class="streak-card">
          <div class="num" id="streakNum">0</div>
          <div class="lbl">连续打卡天数 🔥</div>
        </div>
      </div>
    </aside>

    <main id="main"><!-- 页面内容由 app.js 渲染 --></main>
  </div>

  <!-- 底部导航栏（手机端显示；平板横屏时隐藏，改用左侧 #sidebar） -->
  <nav class="bottom-nav">
    <div class="nav-item" data-page="learn"><span class="ic">📘</span><span class="lb">今日学习</span></div>
    <div class="nav-item" data-page="review"><span class="ic">🔁</span><span class="lb">智能复习</span></div>
    <div class="nav-item" data-page="library"><span class="ic">📚</span><span class="lb">句式库</span></div>
    <div class="nav-item" data-page="template"><span class="ic">✍️</span><span class="lb">作文模板</span></div>
    <div class="nav-item" data-page="me"><span class="ic">👤</span><span class="lb">我的</span></div>
  </nav>

  <div class="toast" id="toast"></div>

  <!-- 数据脚本（先于 app.js 加载，挂到 window 上） -->
  <script src="data/sentences-a.js"></script>
  <script src="data/sentences-b.js"></script>
  <script src="data/sentences-c.js"></script>
  <script src="data/templates.js"></script>
  <!-- 桥接层：定义 window.api，调用原生 SMBridge（必须在 app.js 之前） -->
  <script src="bridge.js"></script>
  <!-- 调试辅助：捕获 JS 错误显示在页面（正常无感；出错时可见），便于定位问题 -->
  <script>
    (function () {
      function showErr(msg) {
        var box = document.getElementById('jsErr');
        if (!box) {
          box = document.createElement('div');
          box.id = 'jsErr';
          box.style.cssText = 'position:fixed;left:16px;right:16px;bottom:90px;z-index:99999;background:#fff1f0;color:#b71c1c;border:1px solid #ffa4a2;border-radius:10px;padding:12px 14px;font:12px/1.6 sans-serif;white-space:pre-wrap;box-shadow:0 4px 14px rgba(0,0,0,.18)';
          document.body.appendChild(box);
        }
        box.textContent = '程序提示: ' + msg;
      }
      window.addEventListener('error', function (e) {
        showErr((e && e.message ? e.message : '脚本错误') + (e && e.filename ? ' @' + e.filename.split('/').pop() + ':' + e.lineno : ''));
      });
      window.addEventListener('unhandledrejection', function (e) {
        var r = e && e.reason;
        showErr('Promise: ' + (r && r.message ? r.message : String(r)));
      });
    })();
  </script>
  <script src="app.js"></script>
</body>
</html>
