name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'App version, e.g. 1.4.3'
        required: false
        default: '1.4.3'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set version
        id: ver
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then v="${GITHUB_REF_NAME#v}";
          elif [ -n "${{ github.event.inputs.version }}" ]; then v="${{ github.event.inputs.version }}";
          else v="1.4.3"; fi
          echo "APP_VER=$v" >> "$GITHUB_ENV"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        run: |
          sudo apt-get update
          sudo apt-get install -y wget unzip python3
          mkdir -p "$HOME/android-sdk/cmdline-tools"
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O ct.zip
          unzip -q ct.zip -d "$HOME/android-sdk/cmdline-tools"
          mv "$HOME/android-sdk/cmdline-tools/cmdline-tools" "$HOME/android-sdk/cmdline-tools/latest"
          export PATH="$HOME/android-sdk/cmdline-tools/latest/bin:$PATH"
          echo "ANDROID_SDK_ROOT=$HOME/android-sdk" >> "$GITHUB_ENV"
          echo "$HOME/android-sdk/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          yes | sdkmanager --sdk_root="$HOME/android-sdk" --licenses
          sdkmanager --sdk_root="$HOME/android-sdk" "platform-tools" "platforms;android-34" "build-tools;34.0.0"

      - name: Build APK
        run: bash build_apk_linux.sh

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: SentenceMaster-${{ env.APP_VER }}.apk
          path: SentenceMaster-${{ env.APP_VER }}.apk

      - name: Create GitHub Release
        if: >-
          startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VER }}
          name: v${{ env.APP_VER }}
          files: SentenceMaster-${{ env.APP_VER }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
